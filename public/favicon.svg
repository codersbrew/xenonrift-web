<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ringCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0080ff" />
    </linearGradient>
    <linearGradient id="ringVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Backplate -->
  <rect width="64" height="64" rx="14" fill="#060914" stroke="#162238" stroke-width="1.5" />
  
  <!-- Outer Concentric Orbital Ring -->
  <ellipse cx="32" cy="32" rx="26" ry="18" fill="none" stroke="url(#ringCyanGrad)" stroke-width="2" filter="url(#neonGlow)" transform="rotate(-15 32 32)" />
  
  <!-- Inner Concentric Orbital Ring (Violet) -->
  <ellipse cx="32" cy="32" rx="18" ry="12" fill="none" stroke="url(#ringVioletGrad)" stroke-width="2" filter="url(#neonGlow)" transform="rotate(20 32 32)" />

  <!-- Horizontal Rift Horizon Line -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#neonGlow)" />
  
  <!-- Central Quantum Singularity Core -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="32" cy="32" r="2.5" fill="#00f0ff" />
  
  <!-- Orbital Nodes -->
  <circle cx="16" cy="24" r="2" fill="#00f0ff" />
  <circle cx="48" cy="40" r="2" fill="#d946ef" />
</svg>
